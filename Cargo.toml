[package]
name = "kkn-hidroponik"
version = "0.1.0"
authors = ["MRizqiAbdilah <muhammadrizqiabdilah10@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# Penanganan error ketika terjadi crash/panic pada chip
esp-backtrace = { version = "0.14.2", features = [
    "esp32c3",
    "exception-handler",
    "panic-handler",
    "println",
] }
# HAL (Hardware Abstraction Layer) resmi dari Espressif
esp-hal = { version = "0.21.0", features = [ "esp32c3" ] }
# Pustaka untuk mencetak log ke serial monitor
esp-println = { version = "0.12.0", features = ["esp32c3", "log"] }
log = { version = "0.4.22" }
[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s" # Optimasi ukuran biner agar muat di flash memory ESP32

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
